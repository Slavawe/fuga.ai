[package]
name = "fuga"
version = "2.0.0"
edition = "2021"

[dependencies]
cc = "1.3"
chrono = "0.4"
fastrand = "2.5"
hound = "3.5"
lazy_static = "1.5"
libc = "0.2"
memmap2 = "0.9"
minifb = "0.25"
ndarray = "0.16"
pollster = "1.0"
quote = "1.0"
rand = "0.8"
rapier3d = "0.18"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
tiny_http = "0.12"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
ureq = { version = "2.12", features = ["json"] }
walkdir = "2.5"
wgpu = "30.0"

[profile.release]
opt-level = 3
