[package]
name = "fuga"
version = "2.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rayon = "1.10"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
chrono = "0.4"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
lazy_static = "1"
ureq = { version = "2", features = ["json"] }
memmap2 = "0.9"
rapier3d = "0.18"
minifb = "0.25"
hound = "3.5"
fastrand = "2"
tiny_http = "0.12"
libc = "0.2"
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl"] }
pollster = "1.0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true

[build-dependencies]
cc = "1.0"

[[bin]]
name = "fuga"
path = "src/main.rs"

[[bin]]
name = "fuga-tgbot"
path = "src/bin/tgbot.rs"

[[bin]]
name = "fuga-web"
path = "src/bin/omni-web.rs"

[[bin]]
name = "fuga-cube-viz"
path = "src/bin/cube-viz.rs"

[[bin]]
name = "fuga-ingest-knowledge"
path = "src/bin/ingest-knowledge.rs"

[[bin]]
name = "fuga-wave-broadcast"
path = "src/bin/fuga-wave-broadcast.rs"

[[bin]]
name = "fuga-wave-recv"
path = "src/bin/fuga-wave-recv.rs"

[[bin]]
name = "train-jepa"
path = "src/bin/train-jepa.rs"





[[bin]]
name = "hybrid_train_v10"
path = "src/bin/hybrid_train_v10.rs"
